{% extends "base.html" %}

{% block content %}
<div style="text-align: center; padding: 30px 20px;">
    <h2>📊 Отчеты по месяцу</h2>


    <div class="form-container">
        <form action="{{ url_for('reports_bp.report_result_handler') }}" method="post">
            <div style="margin: 20px 0;">
                <label for="report_date" class="form-label">Выберите дату (любой день нужного месяца):</label>
                <input type="date" id="report_date" name="report_date" required
                       class="form-input">
                <small style="color: #666; font-size: 10pt;">Будут показаны все отчеты за весь месяц выбранной даты</small>
            </div>

            <div style="margin: 30px 0;">
                <button type="submit" class="menu-button" style="width: 100%;">
                    📈 Найти отчеты за месяц
                </button>
            </div>
        </form>
    </div>

    <div class="navigation">
        <a href="{{ url_for('reports_bp.add_report_handler') }}" class="menu-button">
            ➕ Добавить отчет
        </a>
        <a href="{{ url_for('menu_bp.main_menu') }}" class="menu-button nav-button">
            🏠 Главное меню
        </a>
    </div>
</div>
{% endblock %}
