{% extends "base.html" %}

{% block content %}
<div style="text-align: center; padding: 30px 20px;">
    <h2>📊 Добавление отчета</h2>

    <div class="form-container">
        <form action="{{ url_for('reports_bp.add_report_result_handler') }}" method="post">
            <div style="margin: 20px 0;">
                <label for="supply_date_month" class="form-label">Месяц поставки (определяет месяц отчета):</label>
                <input type="number" id="supply_date_month" name="supply_date_month" required
                       class="form-input"
                       value="{{ form_data.supply_date if form_data else '' }}">
                <small style="color: #666; font-size: 10pt;">По этой дате будет определен месяц для отчета</small>
            </div>

            <div style="margin: 20px 0;">
                <label for="supply_date_year" class="form-label">Год поставки:</label>
                <input type="number" id="supply_date_year" name="supply_date_year"
                       step="0.01" min="0" max="1000000000" required
                       class="form-input" placeholder="Введите сумму"
                       value="{{ form_data.total_amount if form_data else '' }}">
            </div>

            {% if success_message %}
            <div style="background: #F0FFF0; border: 2px solid #90EE90; border-radius: 10px; padding: 15px; margin: 15px 0;">
                <span style="color: #228B22; font-weight: bold;">✅ {{ success_message }}</span>
            </div>
            {% endif %}

            {% if error_message %}
            <div class="error-message" style="margin: 15px 0; text-align: left;">
                <strong>❌ Ошибка:</strong><br>
                {{ error_message }}
            </div>
            {% endif %}

            <div style="margin: 30px 0;">
                <button type="submit" class="menu-button" style="width: 100%;">
                    💾 Добавить отчет
                </button>
            </div>
        </form>
    </div>

    <div class="navigation">
        <a href="{{ url_for('reports_bp.report_handler') }}" class="menu-button">
            🔍 Поиск отчетов
        </a>
        <a href="{{ url_for('menu_bp.main_menu') }}" class="menu-button nav-button">
            🏠 Главное меню
        </a>
    </div>
</div>
{% endblock %}
