{% extends "base.html" %}

{% block content %}
<div style="text-align: center; padding: 20px;">
    <h2>🛒 Поиск товаров</h2>

    <div class="form-container">
        <form action="{{ url_for('user_shop_bp.products_post') }}" method="post">

            <div style="margin: 20px 0;">
                <label for="product_category" class="form-label">📦 Категория товара:</label>
                <input type="number" id="product_category" name="product_category"
                       class="form-input" placeholder="Например: 2">
            </div>

            <div style="margin: 30px 0;">
                <button type="submit" class="menu-button" style="width: 100%;">🔍 Найти товары</button>
            </div>
        </form>
    </div>

    {% with messages = get_flashed_messages() %}
        {% if messages %}
            <div style="margin: 10px 0; color: red; text-align:center;">
                {% for msg in messages %}
                    <p>{{ msg }}</p>
                {% endfor %}
            </div>
        {% endif %}
    {% endwith %}

    <div class="navigation">
        <a href="{{ url_for('menu_bp.main_menu') }}" class="menu-button nav-button">🏠 Главное меню</a>
    </div>
</div>
{% endblock %}
