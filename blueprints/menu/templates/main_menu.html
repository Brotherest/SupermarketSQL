{% extends "base.html" %}

{% block content %}
<div style="text-align: center; padding: 50px 20px;">
    <h2>🏪 Супермаркет</h2>
    <p style="font-size: 16pt; color: #ffffff; margin-bottom: 40px;">Информационная система</p>

    <div class="navigation">
        <p style="font-size: 14pt; color: #666; margin-bottom: 30px;">Выберите действие:</p>

        <a href="{{ url_for('products_bp.product_handler') }}" class="menu-button">
            Поиск товаров по категории
        </a>
        <a href="{{ url_for('user_shop_bp.products_get') }}" class="menu-button">
            Корзина
        </a>
        {% if session.user.role == 'admin' %}
        <a href="{{ url_for('reports_bp.reports_input') }}" class="menu-button">
            Отчёты
        </a>
        {% endif %}

        <br>
        <a href="{{ url_for('auth_bp.logout_handler') }}" class="menu-button exit-button">
            🚪 Выход из системы
        </a>
    </div>
</div>
{% endblock %}
