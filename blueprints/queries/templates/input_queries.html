{% extends "base.html" %}

{% block content %}
<div style="text-align: center; padding: 30px 20px;">
    <h2>🔍 Поиск информации</h2>

    <div class="form-container">
        <form action="{{ url_for('queries_bp.queries_result_handler') }}" method="post">

            <div class="accordion" style="margin-bottom: 20px;">
                <div class="accordion-item">
                    <input type="radio" name="search_type" id="price_search" value="price" class="accordion-input" checked>
                    <label for="price_search" class="accordion-label">
                         Поиск цены по названию
                    </label>
                    <div class="accordion-content">
                        <div style="margin: 15px 0;">
                            <label for="user_price" class="form-label">⚰️ Введите название товара:</label>
                            <input type="text" id="user_price" name="user_price"
                                   class="form-input" placeholder="Например: Ананас">
                        </div>
                    </div>
                </div>

                <!-- Поиск по ID товара -->
                <div class="accordion-item">
                    <input type="radio" name="search_type" id="type_search" value="type" class="accordion-input">
                    <label for="type_search" class="accordion-label">
                         Поиск товаров по категории
                    </label>
                    <div class="accordion-content">
                        <div style="margin: 15px 0;">
                            <label for="user_type" class="form-label">🌚 Введите категорию товара:</label>
                            <input type="text" id="user_type" name="user_type"
                                   class="form-input" placeholder="Например: 1">
                        </div>
                    </div>
                </div>
            </div>

            <div style="margin: 30px 0;">
                <button type="submit" class="menu-button" style="width: 98%;">
                    🕯️ Найти
                </button>
            </div>
        </form>
    </div>

    <div class="navigation">
        <a href="{{ url_for('menu_bp.main_menu') }}" class="menu-button nav-button">🏚️ Главное меню</a>
    </div>
</div>

<style>
.accordion {
    border-radius: 15px;
    overflow: hidden;
    box-shadow: 0 5px 15px rgba(255, 182, 193, 0.3);
}

.accordion-item {
    border-bottom: 1px solid #D2B48C;
}

.accordion-item:last-child {
    border-bottom: none;
}

.accordion-input {
    display: none;
}

.accordion-label {
    display: block;
    padding: 20px;
    background: linear-gradient(145deg, #FAEBD7, #FFFFF0);
    color: MidnightBlue;
    font-size: 14pt;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.3s ease;
    text-align: center;
}

.accordion-label:hover {
    background: linear-gradient(145deg, #6A5ACD, #FFF8DC);
    color: white;
}

.accordion-input:checked + .accordion-label {
    background: linear-gradient(145deg, #6A5ACD, #FFF8DC);
    color: white;
}

.accordion-content {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.3s ease;
    background: rgba(255, 250, 250, 0.9);
}

.accordion-input:checked + .accordion-label + .accordion-content {
    max-height: 200px;
    padding: 20px;
}
</style>

<script>
document.querySelectorAll('.accordion-input').forEach(input => {
    input.addEventListener('change', function() {
        document.querySelectorAll('.form-input').forEach(field => {
            field.required = false;
        });

        const activeContent = this.closest('.accordion-item').querySelector('.accordion-content');
        const activeInput = activeContent.querySelector('.form-input');
        if (activeInput) {
            activeInput.required = true;
        }
    });
});

document.addEventListener('DOMContentLoaded', function() {
    const firstInput = document.querySelector('.accordion-input:checked');
    if (firstInput) {
        const activeContent = firstInput.closest('.accordion-item').querySelector('.accordion-content');
        const activeInput = activeContent.querySelector('.form-input');
        if (activeInput) {
            activeInput.required = true;
        }
    }
});
</script>
{% endblock %}
