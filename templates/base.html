<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>"Супермаркет" - Информационная система</title>
    <style>
        body {
            font-family: 'Verdana', 'Arial', sans-serif;
            background: url("{{ url_for('static', filename='image/background.png') }}") no-repeat center center fixed;
            background-size: cover;
            margin: 0;
            padding: 0;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            /* 4 4 — смещение активной точки внутри картинки */
        }

        .container {
            width: 800px;
            background: linear-gradient(135deg, rgba(255, 228, 181, 0.7) 0%, rgba(238, 218, 185, 0.7) 50%, rgba(128, 128, 128, 0.7) 100%);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(139, 0, 0, 1);
            padding: 30px;
            min-height: 50vh;
            margin-top: 100px;
            margin-left: -800px;
            backdrop-filter: blur(5px);
        }

        h2 {
            font-size: 28pt;
            font-weight: bold;
            color: #FFF5EE;
            text-align: center;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        .menu-button {
            display: inline-block;
            padding: 20px 30px;
            margin: 15px;
            background: linear-gradient(145deg, #FFF8DC, #FF4500);
            color: white;
            text-decoration: none;
            border: none;
            border-radius: 15px;
            font-size: 16pt;
            font-weight: bold;
            transition: all 2s ease;
            box-shadow: 0 5px 15px rgba(230, 230, 250, 1);
            min-width: 250px;
            text-align: center;
        }

        .menu-button:hover {
            background: linear-gradient(145deg, #FF4500, #FFF8DC);
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(230, 230, 250, 1);
            text-decoration: none;
            transition: all 2s ease;
            color: white;
        }

        .exit-button {
            background: linear-gradient(145deg, #FFF8DC, #FF4500);
        }

        .exit-button:hover {
            background: linear-gradient(145deg, #FF4500, #FFF8DC);
        }

        .nav-button {
            background: linear-gradient(145deg, #FFF8DC, #FF4500);
        }

        .nav-button:hover {
            background: linear-gradient(145deg, #FF4500, #FFF8DC);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin: 25px 0;
            border-radius: 15px;
            overflow: hidden;
        }

        th {
            background: linear-gradient(145deg, #FAEBD7, #FFFFF0);
            color: MidnightBlue;
            padding: 20px;
            font-size: 14pt;
            font-weight: bold;
            text-align: center;
        }

        td {
            padding: 15px;
            text-align: center;
            border-bottom: 1px solid #FFFFFF;
            font-size: 12pt;
            color: #333;
        }

        tr {
            background-color: rgba(255, 239, 213, 0.9);
        }

        tr:nth-child(even) {
            background-color: rgba(255, 239, 213, 0.9);
        }

        .navigation {
            text-align: center;
            margin: 30px 0;
            padding: 20px;
            background: rgba(245, 245, 220, 0.9);
            border-radius: 15px;
        }

        .error-message {
            background: rgba(255, 250, 250, 0.9);
            border: 2px solid #000080;
            border-radius: 15px;
            padding: 30px;
            margin: 30px 0;
            text-align: center;
            font-size: 16pt;
            color: #800000;
            font-weight: bold;
        }

        .form-container {
            background: rgba(253, 245, 238, 0.9);
            padding: 30px;
            border-radius: 20px;
            margin: 20px auto;
            max-width: 500px;
            box-shadow: 0 5px 15px rgba(255, 182, 193, 0.3);
        }

        .form-input {
            width: 100%;
            padding: 15px;
            margin: 15px 0;
            border: 2px solid #D2B48C;
            border-radius: 10px;
            font-size: 14pt;
            box-sizing: border-box;
        }

        .form-input:focus {
            outline: none;
            border-color: #000000;
            box-shadow: 0 0 10px rgba(255, 105, 180, 0.3);
        }

        .form-label {
            font-size: 14pt;
            color: #800000;
            font-weight: bold;
            display: block;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
